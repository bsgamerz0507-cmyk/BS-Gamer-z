<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Gamer_z - Gaming Videos, Shorts & Live Streams</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff0000;
            font-size: 40px;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat {
            background: #181818;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 14px;
        }
        .stat strong {
            display: block;
            font-size: 24px;
            color: #ff0000;
        }
        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
        }
        .video-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
        .card-info {
            padding: 15px;
            font-size: 14px;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #777;
        }
    .video-thumbnail {
        position: relative;
        cursor: pointer;
        width: 100%;
        height: 200px;
        background: #181818;
        overflow: hidden;
    }

    .video-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .video-thumbnail .play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        color: #fff;
        background: rgba(255, 0, 0, 0.8);
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .video-thumbnail:hover .play-button {
        background: #ff0000;
    }

    .video-thumbnail iframe {
        width: 100%;
        height: 100%;
    }
        .filter-tabs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
        flex-wrap: wrap;
    }

    .tab-btn {
        background: #272727;
        border: 1px solid #333;
        color: #fff;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    .tab-btn.active {
        background: #ff0000;
        border-color: #ff0000;
        color: #fff;
    }

    .tab-btn:hover {
        background: #333;
    }
        .theme-toggle {
        background: #333;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin: 10px auto;
        display: block;
    }

    body.light-mode {
        background: #f5f5f5;
        color: #222;
    }

    body.light-mode .video-card {
        background: #fff;
        border-color: #ddd;
    }
    .theme-toggle {
        background: #333;
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 20px;
        cursor: pointer;
        margin: 15px auto;
        display: block;
        transition: 0.2s;
    }

    .theme-toggle:hover {
        background: #555;
    }

    body.light-mode {
        background: #f5f5f5 !important;
        color: #222 !important;
    }

    body.light-mode h1 {
        color: #ff0000 !important;
    }

    body.light-mode .video-card {
        background: #fff !important;
        border-color: #ddd !important;
    }

    body.light-mode .stat {
        background: #fff !important;
        border-color: #ddd !important;
        color: #222 !important;
    }

    body.light-mode .filter-tabs .tab-btn {
        background: #eee !important;
        border-color: #ddd !important;
        color: #222 !important;
    }

    body.light-mode .tab-btn.active {
        background: #ff0000 !important;
        color: #fff !important;
    }
    /* Theme Switch */
    .theme-switch {
        display: none;
    }

    .theme-toggle-label {
        display: block;
        width: 40px;
        height: 40px;
        background: #333;
        color: #fff;
        border-radius: 50%;
        text-align: center;
        line-height: 40px;
        font-size: 20px;
        cursor: pointer;
        margin: 10px auto;
    }

    /* When checkbox is checked, change to light mode */
    .theme-switch:checked ~ body {
        background: #f5f5f5 !important;
        color: #222 !important;
    }

    .theme-switch:checked ~ body .video-card {
        background: #fff !important;
        border-color: #ddd !important;
    }

    .theme-switch:checked ~ body .stat {
        background: #fff !important;
        border-color: #ddd !important;
        color: #222 !important;
    }

    .theme-switch:checked ~ body h1 {
        color: #ff0000 !important;
    }
    .theme-toggle-link {
        display: block;
        width: fit-content;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        cursor: pointer;
        margin: 10px auto;
    }
   
    .theme-toggle-btn {
        background: #333;
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }
    </style>
<link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>BS Gamer_z</h1>
       <p>Free Fire Gaming • Shorts • Live Streams</p>
    
    <div class="stats">
        <div class="stat"><strong>217</strong> Videos</div>
        <div class="stat"><strong>65</strong> Shorts</div>
        <div class="stat"><strong>0</strong> Live</div>
    </div>
    <!-- ==========================================
     FILTER TABS
     ========================================== -->
<div class="filter-tabs">
    <button class="tab-btn active" onclick="filterVideos('all')">All</button>
    <button class="tab-btn" onclick="filterVideos('video')">🎬 Videos</button>
    <button class="tab-btn" onclick="filterVideos('short')">📱 Shorts</button>
</div>
    <div class="videos">
        <!-- Video 1 -->
        <div class="video-card">
            <iframe src="https://www.youtube.com/embed/0txpsEp8fqM" allowfullscreen></iframe>
            <div class="card-info"><strong>10 KILLS + BOOYAH! 😱 | Free Fire MAX BR Gameplay</strong></div>
        </div>
        <!-- Video 2 -->
        <div class="video-card">
            <iframe src="https://www.youtube.com/embed/s5U0DYPRc20" allowfullscreen></iframe>
            <div class="card-info"><strong>6yrs Journey 😍 | #journey #ytshorts</strong></div>
        </div>
    </div>

    <div class="footer">
        © 2026 BS Gamer_z • Made with ❤️
    </div>
<script>
    // ==========================================
    // LOAD ALL 273 VIDEOS FROM JSON
    // ==========================================
    fetch('data/youtube.json')
        .then(response => response.json())
        .then(data => {
            var videos = data.videos;
            var grid = document.querySelector('.videos');
            
            // Clear existing videos
            grid.innerHTML = '';
            
            // Show all videos
            videos.forEach(function(video) {
                var card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
                    <div class="card-info"><strong>${video.title}</strong></div>
                `;
                grid.appendChild(card);
            });
        })
        .catch(error => {
            console.log('Could not load all videos. Showing only 2 videos.');
        });
</script>
<script>
    // Load videos from data/youtube.json
    fetch('data/youtube.json')
        .then(response => response.json())
        .then(data => {
            var videos = data.videos;
            var grid = document.querySelector('.videos');
            
            if (grid) {
                // Clear existing videos
                grid.innerHTML = '';
                
                // Show all 15 videos
                videos.forEach(function(video) {
                    var card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
                        <div class="card-info"><strong>${video.title}</strong></div>
                    `;
                    grid.appendChild(card);
                });
            }
        })
        .catch(error => console.log('Could not load videos. Using manual videos.'));
</script>
<script>
    // Load videos from data/youtube.json
    fetch('data/youtube.json')
        .then(response => response.json())
        .then(data => {
            var videos = data.videos;
            var grid = document.querySelector('.videos');
            
            if (grid) {
                grid.innerHTML = '';
                
                videos.forEach(function(video) {
                    // Create a card with thumbnail only
                    var card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-thumbnail" data-video-id="${video.id}" onclick="playVideo(this)">
                            <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy">
                            <div class="play-button">▶</div>
                        </div>
                        <div class="card-info"><strong>${video.title}</strong></div>
                    `;
                    grid.appendChild(card);
                });
            }
        })
        .catch(error => console.log('Could not load videos.'));
    
    // Function to play video when thumbnail is clicked
    function playVideo(element) {
        var videoId = element.getAttribute('data-video-id');
        element.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`;
    }
</script>
<script>
    // Store all videos globally
    var allVideos = [];
    
    // Load videos and store them
    fetch('data/youtube.json')
        .then(response => response.json())
        .then(data => {
            allVideos = data.videos;
            filterVideos('all'); // Show all videos initially
        });

    // Filter videos by type
    function filterVideos(type) {
        var grid = document.querySelector('.videos');
        grid.innerHTML = '';
        
        var filteredVideos = allVideos.filter(function(video) {
            if (type === 'all') return true;
            return video.type === type;
        });
        
        // Show filtered videos
        filteredVideos.forEach(function(video) {
            var card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-thumbnail" data-video-id="${video.id}" onclick="playVideo(this)">
                    <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy">
                    <div class="play-button">▶</div>
                </div>
                <div class="card-info"><strong>${video.title}</strong></div>
            `;
            grid.appendChild(card);
        });
        
        // Update active tab
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
    }

    // Function to play video when thumbnail is clicked
    function playVideo(element) {
        var videoId = element.getAttribute('data-video-id');
        element.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`;
    }
</script>
  
</body>
</html>
